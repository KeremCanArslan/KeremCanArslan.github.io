name: MEXC verisi

# ornek/kripto-canli test sayfası için MEXC verisini 30 dakikada bir yeniler:
# kopya trade özeti (mexc.json, yaklaşık 20 dakika) ve Big Data ekranı (mexc-oran.json, yaklaşık 10 dakika).
# İki iş ayrı makinede aynı anda çalışır; üst üste binmesin diye aynı anda tek çalışma.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mexc-veri
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: MEXC kopya trader taraması
        run: node .github/mexc/topla.mjs ornek/kripto-canli/mexc.json

      - name: Özeti kaydet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ornek/kripto-canli/mexc.json
          if git diff --cached --quiet; then echo 'Değişiklik yok'; exit 0; fi
          git commit -m 'Veri: MEXC kopya trader özeti'
          # Öbür iş de aynı anda gönderebilir: reddedilirse yeniden çekip dener
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1

  oran:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: MEXC Big Data taraması
        run: node .github/mexc/oran.mjs ornek/kripto-canli/mexc-oran.json

      - name: Özeti kaydet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ornek/kripto-canli/mexc-oran.json
          if git diff --cached --quiet; then echo 'Değişiklik yok'; exit 0; fi
          git commit -m 'Veri: MEXC Big Data özeti'
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1
