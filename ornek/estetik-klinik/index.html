<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Örnek Medikal Estetik — Dört Dilli Kurumsal Site Örneği</title>
<meta name="description" content="Medikal estetik hekimi için Türkçe, İngilizce, Rusça ve Almanca kurumsal site örneği.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--ink:#1c1d21;--ink2:#5d5f66;--line:#e6e1dc;--bg:#fff;--soft:#f6f2ee;--acc:#8a5a44;--acc2:#6f4634}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:16px}
.ornek{background:#1c1d21;color:#cfd0d4;font-size:12px;text-align:center;padding:6px 16px}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
header .w{display:flex;align-items:center;height:68px;gap:28px}
.logo{font-family:"Cormorant Garamond",serif;font-size:25px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.logo span{color:var(--acc)}
nav{display:flex;gap:22px;flex:1}
nav a{color:var(--ink);text-decoration:none;font-size:14px}
nav a:hover{color:var(--acc)}
.dil{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.dil button{border:0;background:#fff;font:inherit;font-size:12.5px;font-weight:600;padding:6px 9px;cursor:pointer;color:var(--ink2)}
.dil button.on{background:var(--ink);color:#fff}
.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;border:0;border-radius:6px;padding:12px 20px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{background:var(--acc2)}
.btn.ikinci{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.hero{padding:72px 0 64px;border-bottom:1px solid var(--line)}
.hero .w{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center}
.ust{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(38px,5.4vw,62px);line-height:1.05;margin:14px 0 18px}
.hero p{color:var(--ink2);max-width:520px;font-size:17px}
.hero .dugme{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.kemer{aspect-ratio:4/5;border-radius:220px 220px 8px 8px;background:var(--soft);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:28px;position:relative;overflow:hidden}
.kemer:before{content:"";position:absolute;left:50%;top:18%;width:58%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;border:1px solid #d8cbc1}
.kemer b{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;position:relative}
.kemer small{color:var(--ink2);position:relative}
section{padding:68px 0}
h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(30px,3.6vw,42px);line-height:1.1;margin:10px 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.u{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 24px 28px}
.u h3{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;margin-bottom:8px}
.u p{color:var(--ink2);font-size:14.5px}
.u .sure{margin-top:14px;font-size:12.5px;color:var(--acc);font-weight:600}
.hekim{background:var(--soft)}
.hekim .w{display:grid;grid-template-columns:1fr 1.4fr;gap:48px;align-items:start}
.portre{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:8px;display:grid;place-items:center;color:var(--ink2);font-size:13px;text-align:center;padding:20px}
.hekim ul{list-style:none;margin-top:18px;border-top:1px solid var(--line)}
.hekim li{padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;display:flex;gap:14px}
.hekim li b{min-width:130px;font-weight:600}
.adim{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.adim div{border-top:2px solid var(--ink);padding-top:16px}
.adim i{font-style:normal;font-family:"Cormorant Garamond",serif;font-size:34px;color:var(--acc)}
.adim h3{font-size:16px;font-weight:600;margin:4px 0 6px}
.adim p{color:var(--ink2);font-size:14px}
.iletisim .w{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.bilgi p{margin-bottom:10px;color:var(--ink2)}
.bilgi b{color:var(--ink);font-weight:600;display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
form{display:grid;gap:12px}
form label{font-size:13px;font-weight:600}
form input,form select,form textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:11px 12px;font:inherit;font-size:15px;background:#fff}
form textarea{min-height:96px;resize:vertical}
.onay{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);font-weight:400}
.onay input{width:auto;margin-top:4px}
.tamam{display:none;border:1px solid #cfe3d3;background:#f2f8f3;color:#24573a;padding:12px 14px;border-radius:6px;font-size:14px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--ink2);font-size:13px}
footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
@media(max-width:900px){nav{display:none}.hero .w,.hekim .w,.iletisim .w{grid-template-columns:1fr}.kemer{max-width:360px}.grid{grid-template-columns:1fr 1fr}.adim{grid-template-columns:1fr 1fr}}
@media(max-width:560px){header .w{gap:12px}.logo{font-size:21px}.grid{grid-template-columns:1fr}.adim{grid-template-columns:1fr}.hekim li{flex-direction:column;gap:2px}section{padding:52px 0}.hero{padding:48px 0}}
</style>
</head>

<header><div class="w">
  <div class="logo">Örnek <span>Estetik</span></div>
  <nav><a href="#uygulamalar" data-t="n1"></a><a href="#hekim" data-t="n2"></a><a href="#surec" data-t="n3"></a><a href="#iletisim" data-t="n4"></a></nav>
  <div class="dil" id="dil"><button data-l="tr">TR</button><button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="de">DE</button></div>
</div></header>

<div class="hero"><div class="w">
  <div>
    <div class="ust" data-t="h_ust"></div>
    <h1 data-t="h1"></h1>
    <p data-t="h_p"></p>
    <div class="dugme"><a class="btn" href="#iletisim" data-t="h_b1"></a><a class="btn ikinci" href="#uygulamalar" data-t="h_b2"></a></div>

  <div class="kemer"><b>Dr. Ad Soyad</b><small data-t="h_unvan"></small></div>

<section id="uygulamalar"><div class="w">

  <h2 data-t="u_h"></h2>
  <div class="grid" id="grid"></div>
</div></section>

<section id="hekim" class="hekim"><div class="w">

</div></section>

<section id="surec"><div class="w">

  <div class="adim" id="adim"></div>
</div></section>

<section id="iletisim" class="iletisim" style="background:var(--soft)"><div class="w">

    <div class="ust" data-t="i_ust"></div>
    <h2 data-t="i_h"></h2>
    <p><b data-t="i_adres_b"></b><span data-t="i_adres"></span></p>
    <p><b data-t="i_saat_b"></b><span data-t="i_saat"></span></p>
    <p><b data-t="i_dil_b"></b>Türkçe, English, Русский, Deutsch</p>
  </div>
  <form id="form">
    <label data-t="f_ad"></label><input required>
    <label data-t="f_tel"></label><input required type="tel">
    <label data-t="f_ilgi"></label><select id="ilgi"></select>
    <label data-t="f_not"></label><textarea></textarea>
    <label class="onay"><input type="checkbox" required><span data-t="f_kvkk"></span></label>
    <button class="btn" type="submit" data-t="f_gonder"></button>
    <div class="tamam" id="tamam" data-t="f_tamam"></div>
  </form>
</div></section>

<footer><div class="w"><span data-t="alt"></span><span>© Örnek Estetik</span></div></footer>

 document.getElementById('grid').innerHTML=t.u.map(x=>`<div class="u"><h3>${x[0]}</h3><p>${x[1]}</p><div class="sure">${x[2]}</div></div>`).join('');
 document.getElementById('kunye').innerHTML=t.k.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('');
 document.getElementById('adim').innerHTML=t.s.map((x,i)=>`<div><i>0${i+1}</i><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('');
